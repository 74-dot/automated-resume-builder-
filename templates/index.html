<!DOCTYPE html>
<html>
<head>
    <title>Resume Builder</title>
</head>
<body>

<h1>Resume Builder</h1>

<form action="/generate" method="POST"
enctype="multipart/form-data">

    <input type="text" name="name" placeholder="Name"><br><br>

    <input type="email" name="email" placeholder="Email"><br><br>

    <input type="text" name="phone" placeholder="Phone Number"><br><br>
    
    <input type="file" name="photo" accept="image/*">

    <input type="text" name="dob" placeholder="Date of Birth"><br><br>

    <input type="text" name="gender" placeholder="Gender"><br><br>

    <input type="text" name="nationality" placeholder="Nationality"><br><br>

    <input type="text" name="languages" placeholder="Languages Known"><br><br>

    <input type="text" name="education" placeholder="Education"><br><br>

    <input type="text" name="skills" placeholder="Skills"><br><br>

    <input type="text" name="projects" placeholder="Projects"><br><br>

    <input type="text" name="certifications" placeholder="Certifications"><br><br>

    <input type="text" name="hobbies" placeholder="Hobbies"><br><br>

    <button type="submit">
        Generate Resume
    </button>

</form>

</body>
</html>
